name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Applies a real Seatbelt profile to a throwaway process and asserts that
      # denied reads, renames, hardlinks, and policy-file writes are blocked.
      - run: bun run e2e
